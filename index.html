<script>
const micBtn = document.getElementById("micBtn");
const voiceText = document.getElementById("voiceText");
const statusText = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

const synth = window.speechSynthesis;

let recognition;
let isListening = false;

if (!SpeechRecognition) {
    statusText.innerText = "Voice not supported";
} else {
    recognition = new SpeechRecognition();

    // Hindi primary recognition
    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;

    recognition.onstart = () => {
        isListening = true;
        statusText.innerText = "Listening...";
        voiceText.innerText = "I am listening...";
    };

    recognition.onresult = (event) => {
        const command =
            event.results[0][0].transcript.toLowerCase().trim();

        voiceText.innerText = command;
        processCommand(command);
    };

    recognition.onerror = (event) => {
        statusText.innerText = "Voice Error: " + event.error;
        voiceText.innerText = "Please try again";
    };

    recognition.onend = () => {
        isListening = false;
        if (statusText.innerText === "Listening...") {
            statusText.innerText = "System Ready";
        }
    };
}

function speak(message, language = "hi-IN") {
    synth.cancel();

    const speech = new SpeechSynthesisUtterance(message);
    speech.lang = language;
    speech.rate = 1;
    speech.pitch = 1;

    synth.speak(speech);
    voiceText.innerText = message;
    statusText.innerText = "Speaking...";
    
    speech.onend = () => {
        statusText.innerText = "System Ready";
    };
}

function isEnglish(text) {
    return /^[a-z0-9\s.,?!'()+\-*/]+$/i.test(text);
}

function processCommand(command) {

    const english = isEnglish(command);

    // 1. TIME
    if (
        command.includes("time") ||
        command.includes("समय") ||
        command.includes("बजे") ||
        command.includes("टाइम")
    ) {
        const time = new Date().toLocaleTimeString(
            "en-IN",
            {
                timeZone: "Asia/Kolkata",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

        speak(
            english
                ? "Sir, the time is " + time
                : "सर, अभी समय है " + time,
            english ? "en-IN" : "hi-IN"
        );
        return;
    }

    // 2. DATE
    if (
        command.includes("date") ||
        command.includes("तारीख") ||
        command.includes("आज कौन सा दिन")
    ) {
        const date = new Date().toLocaleDateString(
            "en-IN",
            {
                timeZone: "Asia/Kolkata",
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

        speak(
            english
                ? "Sir, today's date is " + date
                : "सर, आज की तारीख है " + date,
            english ? "en-IN" : "hi-IN"
        );
        return;
    }

    // 3. YOUTUBE
    if (
        command.includes("youtube") ||
        command.includes("यूट्यूब")
    ) {
        speak(
            english
                ? "Opening YouTube, Sir."
                : "सर, यूट्यूब खोल रहा हूँ।",
            english ? "en-IN" : "hi-IN"
        );

        setTimeout(() => {
            window.open("https://www.youtube.com", "_blank");
        }, 1000);
        return;
    }

    // 4. GOOGLE SEARCH
    if (
        command.includes("search") ||
        command.includes("google") ||
        command.includes("सर्च") ||
        command.includes("खोजो")
    ) {
        let query = command
            .replace(/search|google|सर्च|खोजो/gi, "")
            .trim();

        if (!query) {
            speak(
                english
                    ? "What should I search, Sir?"
                    : "सर, क्या सर्च करना है?"
            );
            return;
        }

        speak(
            english
                ? "Searching Google, Sir."
                : "सर, गूगल पर सर्च कर रहा हूँ।",
            english ? "en-IN" : "hi-IN"
        );

        setTimeout(() => {
            window.open(
                "https://www.google.com/search?q=" +
                encodeURIComponent(query),
                "_blank"
            );
        }, 1000);
        return;
    }

    // 5. CALCULATOR
    if (
        command.includes("calculate") ||
        command.includes("calculator") ||
        command.includes("गणना") ||
        command.includes("कितना होगा")
    ) {
        let expression = command
            .replace(/calculate|calculator|गणना|कितना होगा/gi, "")
            .replace(/plus|जोड़|जमा/gi, "+")
            .replace(/minus|घटा/gi, "-")
            .replace(/multiply|गुणा/gi, "*")
            .replace(/divide|भाग/gi, "/")
            .replace(/x/gi, "*")
            .replace(/[^0-9+\-*/().\s]/g, "")
            .trim();

        try {
            if (
                !expression ||
                !/^[0-9+\-*/().\s]+$/.test(expression)
            ) {
                throw new Error("Invalid");
            }

            const result = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if (!Number.isFinite(result)) {
                throw new Error("Invalid");
            }

            speak(
                english
                    ? "The answer is " + result
                    : "इसका जवाब है " + result,
                english ? "en-IN" : "hi-IN"
            );

        } catch {
            speak(
                english
                    ? "Sorry Sir, please say the calculation clearly."
                    : "माफ कीजिए सर, कृपया हिसाब दोबारा बोलिए।",
                english ? "en-IN" : "hi-IN"
            );
        }
        return;
    }

    // HELP
    if (
        command.includes("help") ||
        command.includes("मदद") ||
        command.includes("commands")
    ) {
        speak(
            english
                ? "Sir, I can tell time and date, search Google, open YouTube and calculate."
                : "सर, मैं समय और तारीख बता सकता हूँ, गूगल सर्च कर सकता हूँ, यूट्यूब खोल सकता हूँ और हिसाब लगा सकता हूँ।",
            english ? "en-IN" : "hi-IN"
        );
        return;
    }

    // GREETINGS
    if (
        command.includes("hello") ||
        command.includes("हेलो") ||
        command.includes("नमस्ते")
    ) {
        speak(
            english
                ? "Hello Sir. JARVIS is ready."
                : "नमस्ते सर। जार्विस तैयार है।",
            english ? "en-IN" : "hi-IN"
        );
        return;
    }

    speak(
        english
            ? "Sorry Sir, I don't understand this command yet."
            : "माफ कीजिए सर, मैं अभी यह कमांड नहीं समझ पाया।",
        english ? "en-IN" : "hi-IN"
    );
}

// MICROPHONE BUTTON
micBtn.addEventListener("click", () => {
    if (!recognition) {
        speak("Voice recognition is not supported.");
        return;
    }

    if (isListening) {
        recognition.stop();
    } else {
        synth.cancel();
        recognition.start();
    }
});

statusText.innerText = "System Ready";
voiceText.innerText = "JARVIS V1.0 ONLINE";
</script>

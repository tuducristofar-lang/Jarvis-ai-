<script>

/* =========================
   JARVIS V1.0
   VOICE COMMAND SYSTEM
========================= */

const app = document.getElementById("app");
const micBtn = document.getElementById("micBtn");
const voiceText = document.getElementById("voiceText");
const status = document.getElementById("status");

let recognition = null;
let isListening = false;
let currentLanguage = "en-IN";
let longPressTimer = null;
let longPressed = false;


/* =========================
   VOICE RECOGNITION SUPPORT
========================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


/* =========================
   VOICE OUTPUT
========================= */

function jarvisSpeak(message) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = "en-IN";
    speech.rate = 0.95;
    speech.pitch = 1;
    speech.volume = 1;

    speech.onstart = () => {
        app.classList.add("speaking");
        status.innerText = "Speaking";
    };

    speech.onend = () => {
        app.classList.remove("speaking");
        status.innerText = "Active";
    };

    speech.onerror = () => {
        app.classList.remove("speaking");
        status.innerText = "Active";
    };

    speechSynthesis.speak(speech);
}


/* =========================
   RESPONSE
========================= */

function respond(message) {

    voiceText.innerText = "JARVIS: " + message;

    jarvisSpeak(message);

}


/* =========================
   TIME FUNCTION
========================= */

function getTime() {

    return new Date().toLocaleTimeString("en-IN", {
        timeZone: "Asia/Kolkata",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    });

}


/* =========================
   DATE FUNCTION
========================= */

function getDate() {

    return new Date().toLocaleDateString("en-IN", {
        timeZone: "Asia/Kolkata",
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

}


/* =========================
   COMMAND PROCESSING
========================= */

function processCommand(command) {

    let text = command.toLowerCase().trim();

    text = text.replace(/[.,?!।]/g, " ");
    text = text.replace(/\s+/g, " ");

    let reply = "";

    /* TIME */

    if (
        /\btime\b/.test(text) ||
        text.includes("समय") ||
        text.includes("टाइम") ||
        text.includes("kitne baje") ||
        text.includes("कितने बजे") ||
        text.includes("समय बताओ")
    ) {

        reply = "Sir, the current time is " + getTime();

    }

    /* DATE */

    else if (
        /\b(date|today|day)\b/.test(text) ||
        text.includes("तारीख") ||
        text.includes("दिनांक") ||
        text.includes("आज") ||
        text.includes("tarikh")
    ) {

        reply = "Sir, today's date is " + getDate();

    }

    /* NAME */

    else if (
        text.includes("your name") ||
        text.includes("who are you") ||
        text.includes("naam kya") ||
        text.includes("नाम क्या") ||
        text.includes("आप कौन")
    ) {

        reply = "I am JARVIS, your personal voice assistant.";

    }

    /* HOW ARE YOU */

    else if (
        text.includes("how are you") ||
        text.includes("कैसे हो") ||
        text.includes("कैसा है") ||
        text.includes("kaise ho")
    ) {

        reply = "I am functioning perfectly, Sir. Thank you for asking.";

    }

    /* GREETING */

    else if (
        text.includes("hello") ||
        text.includes("hey") ||
        text.includes("hi") ||
        text.includes("हेलो") ||
        text.includes("हैलो") ||
        text.includes("नमस्ते") ||
        text.includes("जार्विस")
    ) {

        reply = "Hello Sir. How can I help you?";

    }

    /* THANK YOU */

    else if (
        text.includes("thank you") ||
        text.includes("thanks") ||
        text.includes("धन्यवाद") ||
        text.includes("शुक्रिया")
    ) {

        reply = "You are welcome, Sir.";

    }

    /* GOOD MORNING */

    else if (text.includes("good morning")) {

        reply = "Good morning Sir. Have a wonderful day.";

    }

    /* GOOD NIGHT */

    else if (text.includes("good night")) {

        reply = "Good night Sir. Take care.";

    }

    /* YOUTUBE */

    else if (
        text.includes("youtube") ||
        text.includes("यूट्यूब")
    ) {

        respond("Opening YouTube, Sir.");

        setTimeout(() => {
            window.location.href = "https://www.youtube.com/";
        }, 1200);

        return;

    }

    /* GOOGLE */

    else if (
        text.includes("google") ||
        text.includes("गूगल")
    ) {

        respond("Opening Google, Sir.");

        setTimeout(() => {
            window.location.href = "https://www.google.com/";
        }, 1200);

        return;

    }

    /* UNKNOWN COMMAND */

    else {

        reply = "Sorry Sir, I cannot understand this command yet.";

    }

    voiceText.innerText =
        "You said: " + command +
        "\nJARVIS: " + reply;

    jarvisSpeak(reply);

}


/* =========================
   START VOICE RECOGNITION
========================= */

function startListening() {

    if (!SpeechRecognition) {

        voiceText.innerText =
            "Voice recognition is not supported. Please use Chrome.";

        return;

    }

    if (isListening) {

        recognition.stop();
        return;

    }

    try {

        speechSynthesis.cancel();

        recognition.start();

    }

    catch (error) {

        voiceText.innerText =
            "Microphone is busy. Please try again.";

    }

}


/* =========================
   RECOGNITION SETUP
========================= */

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = currentLanguage;
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 5;


    recognition.onstart = () => {

        isListening = true;

        micBtn.classList.add("listening");
        app.classList.add("listening");

        status.innerText = "Listening";

        voiceText.innerText = "Listening...";

    };


    recognition.onresult = (event) => {

        const alternatives = event.results[0];

        let command = alternatives[0].transcript;

        /* Check other recognition alternatives */

        for (let i = 0; i < alternatives.length; i++) {

            let alternative = alternatives[i].transcript.toLowerCase();

            if (
                alternative.includes("time") ||
                alternative.includes("date") ||
                alternative.includes("today") ||
                alternative.includes("youtube") ||
                alternative.includes("google") ||
                alternative.includes("समय") ||
                alternative.includes("तारीख")
            ) {

                command = alternatives[i].transcript;
                break;

            }

        }

        processCommand(command);

    };


    recognition.onerror = (event) => {

        isListening = false;

        micBtn.classList.remove("listening");
        app.classList.remove("listening");

        status.innerText = "Active";

        if (event.error === "not-allowed" ||
            event.error === "service-not-allowed") {

            voiceText.innerText =
                "Sir, please allow microphone permission.";

        }

        else if (event.error === "no-speech") {

            voiceText.innerText =
                "Sir, I could not hear anything. Please try again.";

        }

        else if (event.error === "network") {

            voiceText.innerText =
                "Sir, internet connection is required.";

        }

        else {

            voiceText.innerText =
                "Voice Error: " + event.error;

        }

    };


    recognition.onend = () => {

        isListening = false;

        micBtn.classList.remove("listening");
        app.classList.remove("listening");

        if (status.innerText === "Listening") {
            status.innerText = "Active";
        }

    };

}


/* =========================
   LANGUAGE SWITCH
   HOLD MIC FOR 1 SECOND
========================= */

micBtn.addEventListener("pointerdown", () => {

    longPressed = false;

    longPressTimer = setTimeout(() => {

        if (isListening || !recognition) {
            return;
        }

        longPressed = true;

        currentLanguage =
            currentLanguage === "en-IN" ? "hi-IN" : "en-IN";

        recognition.lang = currentLanguage;

        let languageName =
            currentLanguage === "en-IN" ? "English" : "Hindi";

        voiceText.innerText =
            "Language changed to " + languageName;

        status.innerText = languageName;

    }, 900);

});


micBtn.addEventListener("pointerup", () => {

    clearTimeout(longPressTimer);

});


micBtn.addEventListener("pointerleave", () => {

    clearTimeout(longPressTimer);

});


micBtn.addEventListener("click", () => {

    if (longPressed) {
        longPressed = false;
        return;
    }

    startListening();

});


/* =========================
   INITIAL STATUS
========================= */

window.addEventListener("load", () => {

    voiceText.innerText =
        "JARVIS V1.0 READY. TAP MICROPHONE TO SPEAK.";

    status.innerText = "Active";

});

</script>

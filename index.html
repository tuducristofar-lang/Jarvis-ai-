<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>JARVIS AI V1.0</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080d20;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 40%,#103c6655,transparent 55%);
    pointer-events:none;
    z-index:-1;
}

.app{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
}

/* HEADER */

.header{
    text-align:center;
    margin-top:15px;
}

.logo{
    font-size:38px;
    letter-spacing:8px;
    font-weight:bold;
    color:#45dcff;
    text-shadow:0 0 20px #00bfff;
    animation:logoGlow 3s infinite alternate;
}

@keyframes logoGlow{
    from{text-shadow:0 0 10px #00bfff;}
    to{text-shadow:0 0 20px #00eaff,0 0 40px #008cff;}
}

.subtitle{
    font-size:11px;
    letter-spacing:4px;
    color:#8bbbdc;
    margin-top:8px;
}

.status{
    margin-top:18px;
    font-size:12px;
    color:#43e9a0;
    animation:statusBlink 2s infinite;
}

@keyframes statusBlink{
    50%{opacity:.5;}
}

/* AI ORB */

.ai-stage{
    height:300px;
    width:100%;
    max-width:400px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.orb{
    width:125px;
    height:125px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,
        #ffffff,
        #50eaff 15%,
        #0877db 45%,
        #071b50 80%);
    box-shadow:0 0 25px #00d9ff,
               0 0 60px #008cff,
               inset 0 0 25px #ffffff55;
    z-index:2;
    animation:jarvisPulse 3s ease-in-out infinite;
    transition:all .4s ease;
}

@keyframes jarvisPulse{
    0%,100%{
        transform:scale(1);
        filter:brightness(1);
        box-shadow:0 0 20px #00d9ff,0 0 50px #008cff;
    }
    50%{
        transform:scale(1.07);
        filter:brightness(1.3);
        box-shadow:0 0 35px #00eaff,0 0 80px #008cff;
    }
}

/* RINGS */

.ring{
    position:absolute;
    border:1px solid #36dfff;
    border-radius:50%;
    box-shadow:0 0 12px #00bfff66;
    transition:all .5s ease;
}

.ring1{
    width:175px;
    height:175px;
    border-top:2px solid #aafaff;
    animation:rotate 8s linear infinite;
}

.ring2{
    width:220px;
    height:220px;
    border-right:2px solid #55aaff;
    animation:rotate 12s linear infinite reverse;
}

.ring3{
    width:265px;
    height:265px;
    border-bottom:2px solid #48eaff;
    animation:rotate 18s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.ai-stage.active .orb{
    filter:brightness(1.5);
    transform:scale(1.1);
}

/* CHAT */

.chat-panel{
    width:100%;
    max-width:650px;
    background:#101d38;
    border:1px solid #24547c;
    border-radius:15px;
    padding:15px;
    box-shadow:0 0 20px #0008;
}

.panel-title{
    color:#42dfff;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:15px;
}

#chat{
    height:180px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

#chat::-webkit-scrollbar{
    width:4px;
}

#chat::-webkit-scrollbar-thumb{
    background:#36cfff;
    border-radius:10px;
}

.message{
    padding:10px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
    max-width:90%;
    word-break:break-word;
    animation:messageEnter .3s ease;
}

@keyframes messageEnter{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.jarvis-message{
    background:#15375a;
    align-self:flex-start;
}

.user-message{
    background:#174d87;
    align-self:flex-end;
}

/* INPUT */

.input-area{
    display:flex;
    gap:8px;
    margin-top:15px;
}

#userInput{
    flex:1;
    min-width:0;
    padding:13px;
    border-radius:9px;
    border:1px solid #287ca8;
    background:#07152c;
    color:white;
    outline:none;
    transition:.3s;
}

#userInput:focus{
    border-color:#43eaff;
    box-shadow:0 0 15px #00bfff55;
}

#sendBtn{
    padding:12px 18px;
    border:none;
    border-radius:9px;
    background:#087ebd;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#sendBtn:hover{
    background:#00a9e8;
    box-shadow:0 0 15px #00bfff;
}

/* MICROPHONE */

.controls{
    margin-top:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
}

#micBtn{
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid #48dfff;
    background:#103b65;
    color:white;
    font-size:23px;
    cursor:pointer;
    box-shadow:0 0 20px #00bfff66;
    transition:.3s;
}

#micBtn:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #00dfff;
}

#micBtn.listening{
    background:#a51f40;
    border-color:#ff718f;
    animation:micPulse 1s infinite;
}

@keyframes micPulse{
    50%{box-shadow:0 0 30px #ff3355;}
}

/* FOOTER */

.footer{
    margin-top:25px;
    font-size:10px;
    letter-spacing:3px;
    color:#6689aa;
}

/* MOBILE */

@media(max-width:600px){
    .app{padding:12px;}
    .chat-panel{padding:12px;}
    #chat{height:165px;}
    .input-area{gap:6px;}
    #sendBtn{padding:11px 13px;}
    .controls{margin-top:18px;}
}

@media(max-width:400px){
    .logo{font-size:32px;}
    .ai-stage{height:270px;}
}

@media(max-width:350px){
    .logo{
        font-size:28px;
        letter-spacing:5px;
    }
    .orb{
        width:105px;
        height:105px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">JARVIS</div>
    <div class="subtitle">PERSONAL AI ASSISTANT</div>
    <div class="status" id="status">● SYSTEM ONLINE</div>
</header>

<div class="ai-stage" id="aiStage">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="orb"></div>
</div>

<div class="chat-panel">

    <div class="panel-title">JARVIS CONSOLE</div>

    <div id="chat">
        <div class="message jarvis-message">
            Hello Sir! I am JARVIS AI V1.0.
            How may I assist you today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask JARVIS anything..."
            autocomplete="off"
        >
        <button id="sendBtn">SEND</button>
    </div>

</div>

<div class="controls">
    <button id="micBtn">🎙</button>
</div>

<div class="footer">
    JARVIS INTELLIGENCE SYSTEM V1.0
</div>

</div>

<script>

"use strict";

/* ELEMENTS */

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const statusText = document.getElementById("status");
const aiStage = document.getElementById("aiStage");

/* VARIABLES */

let isListening = false;
let voiceEnabled = true;
let currentLanguage = "hi-IN";
let recognition = null;

/* CHAT MESSAGE */

function addMessage(message,type){

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = message;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* VOICE */

function speak(text){

    if(!voiceEnabled) return;

    if(!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = currentLanguage;
    speech.rate = 1;
    speech.pitch = 1;

    speech.onstart = function(){
        statusText.textContent = "● JARVIS SPEAKING";
        aiStage.classList.add("active");
    };

    speech.onend = function(){
        statusText.textContent = "● SYSTEM ONLINE";
        aiStage.classList.remove("active");
    };

    speech.onerror = function(){
        statusText.textContent = "● SYSTEM ONLINE";
        aiStage.classList.remove("active");
    };

    window.speechSynthesis.speak(speech);
}

/* LANGUAGE */

function detectLanguage(text){

    if(/[\u0900-\u097F]/.test(text)){
        currentLanguage = "hi-IN";
    }else{
        currentLanguage = "en-IN";
    }
}

/* TIME */

function getTime(){

    const now = new Date();

    return now.toLocaleTimeString(
        currentLanguage,
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );
}

/* DATE */

function getDate(){

    return new Date().toLocaleDateString(
        currentLanguage,
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );
}

/* SAFE CALCULATOR */

function calculateExpression(expression){

    const clean = expression.replace(/\s+/g,"");

    if(!clean || !/^[0-9+\-*/%.()]+$/.test(clean)){
        throw new Error("Invalid expression");
    }

    const tokens = clean.match(/\d*\.?\d+|[()+\-*/%]/g);

    if(!tokens || tokens.join("") !== clean){
        throw new Error("Invalid expression");
    }

    let position = 0;

    function parseExpression(){

        let value = parseTerm();

        while(
            tokens[position] === "+" ||
            tokens[position] === "-"
        ){

            const operator = tokens[position++];

            const right = parseTerm();

            value = operator === "+"
                ? value + right
                : value - right;
        }

        return value;
    }

    function parseTerm(){

        let value = parseFactor();

        while(
            tokens[position] === "*" ||
            tokens[position] === "/" ||
            tokens[position] === "%"
        ){

            const operator = tokens[position++];

            const right = parseFactor();

            if(
                (operator === "/" || operator === "%") &&
                right === 0
            ){
                throw new Error("Division by zero");
            }

            if(operator === "*") value *= right;
            if(operator === "/") value /= right;
            if(operator === "%") value %= right;
        }

        return value;
    }

    function parseFactor(){

        if(tokens[position] === "+"){
            position++;
            return parseFactor();
        }

        if(tokens[position] === "-"){
            position++;
            return -parseFactor();
        }

        if(tokens[position] === "("){

            position++;

            const value = parseExpression();

            if(tokens[position] !== ")"){
                throw new Error("Missing bracket");
            }

            position++;

            return value;
        }

        const token = tokens[position++];

        if(!token || !/^\d*\.?\d+$/.test(token)){
            throw new Error("Invalid number");
        }

        return Number(token);
    }

    const result = parseExpression();

    if(position !== tokens.length || !Number.isFinite(result)){
        throw new Error("Invalid calculation");
    }

    return Number(result.toFixed(8));
}

/* LOCAL COMMAND ENGINE */

function getResponse(text){

    const command = text.toLowerCase().trim();
    const hindi = currentLanguage === "hi-IN";

    /* GREETING */

    if(
        /^(hello|hi|hey|hi jarvis|hey jarvis)$/.test(command) ||
        command.includes("नमस्ते") ||
        command.includes("प्रणाम")
    ){

        return hindi
            ? "नमस्ते सर! मैं आपकी क्या मदद कर सकता हूँ?"
            : "Hello Sir! How may I help you?";
    }

    /* TIME */

    if(
        command.includes("time") ||
        command.includes("समय") ||
        command.includes("टाइम") ||
        command.includes("वक्त")
    ){

        return hindi
            ? "सर, अभी समय है " + getTime()
            : "Sir, the current time is " + getTime();
    }

    /* DATE */

    if(
        command.includes("date") ||
        command.includes("today") ||
        command.includes("दिनांक") ||
        command.includes("तारीख") ||
        command.includes("आज कौन सा दिन")
    ){

        return hindi
            ? "आज की तारीख है " + getDate()
            : "Today's date is " + getDate();
    }

    /* GOOGLE OPEN */

    if(
        command.includes("open google") ||
        command.includes("google kholo") ||
        command.includes("गूगल खोलो")
    ){

        window.open("https://www.google.com","_blank");

        return hindi
            ? "जी सर, Google खोल रहा हूँ।"
            : "Opening Google, Sir.";
    }

    /* YOUTUBE OPEN */

    if(
        command.includes("open youtube") ||
        command.includes("youtube kholo") ||
        command.includes("यूट्यूब खोलो")
    ){

        window.open("https://www.youtube.com","_blank");

        return hindi
            ? "जी सर, YouTube खोल रहा हूँ।"
            : "Opening YouTube, Sir.";
    }

    /* GOOGLE SEARCH */

    let googleQuery = null;

    if(command.startsWith("search ")){
        googleQuery = text.substring(7).trim();
    }

    if(command.includes("google par") && command.includes("search")){
        googleQuery = text
            .replace(/google par/i,"")
            .replace(/search karo/i,"")
            .trim();
    }

    if(command.includes("गूगल पर")){
        googleQuery = text
            .replace(/गूगल पर/,"")
            .replace(/सर्च करो/,"")
            .replace(/खोजो/,"")
            .trim();
    }

    if(googleQuery){

        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(googleQuery),
            "_blank"
        );

        return hindi
            ? "जी सर, Google पर खोज रहा हूँ।"
            : "Searching Google for " + googleQuery;
    }

    /* YOUTUBE SEARCH */

    let youtubeQuery = null;

    if(command.startsWith("play ")){
        youtubeQuery = text.substring(5).trim();
    }

    if(command.includes("youtube par")){
        youtubeQuery = text
            .replace(/youtube par/i,"")
            .replace(/search karo/i,"")
            .replace(/chalao/i,"")
            .trim();
    }

    if(command.includes("यूट्यूब पर")){
        youtubeQuery = text
            .replace(/यूट्यूब पर/,"")
            .replace(/सर्च करो/,"")
            .replace(/चलाओ/,"")
            .trim();
    }

    if(youtubeQuery){

        window.open(
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(youtubeQuery),
            "_blank"
        );

        return hindi
            ? "जी सर, YouTube पर खोज रहा हूँ।"
            : "Searching YouTube for " + youtubeQuery;
    }

    /* CALCULATOR */

    let mathExpression = null;

    if(command.startsWith("calculate ")){
        mathExpression = text.substring(10).trim();
    }

    if(command.startsWith("calculator ")){
        mathExpression = text.substring(11).trim();
    }

    if(command.startsWith("गणना ")){
        mathExpression = text.substring(5).trim();
    }

    if(command.startsWith("calculate") && !mathExpression){
        return "Sir, please enter a calculation. Example: calculate 25+25";
    }

    if(mathExpression){

        try{

            const answer = calculateExpression(mathExpression);

            return hindi
                ? "सर, इसका जवाब है " + answer
                : "Sir, the answer is " + answer;

        }catch(error){

            return hindi
                ? "सर, यह गणना सही नहीं है। कृपया दोबारा लिखें।"
                : "Sorry Sir, invalid calculation.";
        }
    }

    /* HELP */

    if(
        command.includes("help") ||
        command.includes("मदद") ||
        command.includes("क्या कर सकते")
    ){

        return hindi
            ? "सर, मैं समय और तारीख बता सकता हूँ, Calculator चला सकता हूँ, Google और YouTube खोल सकता हूँ तथा Voice Commands समझ सकता हूँ।"
            : "Sir, I can tell time and date, calculate numbers, open Google and YouTube, and understand voice commands.";
    }

    /* IDENTITY */

    if(
        command.includes("who are you") ||
        command.includes("तुम कौन हो")
    ){

        return hindi
            ? "सर, मैं JARVIS AI V1.0 हूँ, आपका Local Command Assistant."
            : "Sir, I am JARVIS AI V1.0, your Local Command Assistant.";
    }

    /* THANK YOU */

    if(
        command.includes("thank you") ||
        command.includes("धन्यवाद") ||
        command.includes("शुक्रिया")
    ){

        return hindi
            ? "आपका स्वागत है सर।"
            : "You are welcome, Sir.";
    }

    /* VOICE OFF */

    if(
        command.includes("mute") ||
        command.includes("voice off")
    ){

        voiceEnabled = false;

        return hindi
            ? "सर, Voice बंद कर दी गई है।"
            : "Voice has been turned off, Sir.";
    }

    /* VOICE ON */

    if(
        command.includes("unmute") ||
        command.includes("voice on")
    ){

        voiceEnabled = true;

        return hindi
            ? "सर, Voice चालू कर दी गई है।"
            : "Voice has been enabled, Sir.";
    }

    /* UNKNOWN COMMAND */

    return hindi
        ? "सर, यह Command अभी मेरे पास उपलब्ध नहीं है। Help लिखकर मेरे Commands देख सकते हैं।"
        : "Sorry Sir, I don't have that command yet. Type Help to see my available commands.";
}

/* PROCESS MESSAGE */

function processMessage(text){

    text = text.trim();

    if(!text) return;

    detectLanguage(text);

    addMessage(text,"user-message");

    input.value = "";

    const response = getResponse(text);

    addMessage(response,"jarvis-message");

    speak(response);

    statusText.textContent = "● SYSTEM ONLINE";
    aiStage.classList.remove("active");
}

/* SEND BUTTON */

sendBtn.addEventListener("click",function(){

    processMessage(input.value);

});

/* ENTER BUTTON */

input.addEventListener("keydown",function(event){

    if(event.key === "Enter"){
        processMessage(input.value);
    }

});

/* VOICE RECOGNITION */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){

        isListening = true;

        micBtn.classList.add("listening");

        statusText.textContent = "● LISTENING";
    };

    recognition.onresult = function(event){

        const transcript =
            event.results[0][0].transcript;

        processMessage(transcript);
    };

    recognition.onerror = function(event){

        statusText.textContent = "● VOICE ERROR";

        if(event.error === "not-allowed"){

            addMessage(
                "Microphone permission denied. Please allow microphone access.",
                "jarvis-message"
            );
        }
    };

    recognition.onend = function(){

        isListening = false;

        micBtn.classList.remove("listening");

        if(
            statusText.textContent === "● LISTENING" ||
            statusText.textContent === "● VOICE ERROR"
        ){
            statusText.textContent = "● SYSTEM ONLINE";
        }
    };

    micBtn.addEventListener("click",function(){

        if(isListening){
            recognition.stop();
            return;
        }

        try{

            recognition.lang = currentLanguage;

            recognition.start();

        }catch(error){

            statusText.textContent = "● PLEASE WAIT";
        }
    });

}else{

    micBtn.disabled = true;

    addMessage(
        "Voice recognition is not supported in this browser. Please use a supported browser.",
        "jarvis-message"
    );
}

/* ESCAPE SHORTCUT */

document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){

        if(window.speechSynthesis){
            window.speechSynthesis.cancel();
        }

        if(isListening && recognition){
            recognition.stop();
        }

        aiStage.classList.remove("active");
        statusText.textContent = "● SYSTEM ONLINE";
    }

});

/* INITIALIZATION */

console.log("JARVIS AI V1.0 ENGINE LOADED");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>JARVIS AI V1.0</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080d20;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 40%,#103c6655,transparent 55%);
    pointer-events:none;
    z-index:-1;
}

.app{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:15px;
}

/* HEADER */

.header{
    text-align:center;
    margin-top:15px;
}

.logo{
    font-size:38px;
    letter-spacing:8px;
    font-weight:bold;
    color:#45dcff;
    text-shadow:0 0 20px #00bfff;
    animation:logoGlow 3s infinite alternate;
}

@keyframes logoGlow{
    from{text-shadow:0 0 10px #00bfff;}
    to{text-shadow:0 0 20px #00eaff,0 0 40px #008cff;}
}

.subtitle{
    font-size:11px;
    letter-spacing:4px;
    color:#8bbbdc;
    margin-top:8px;
}

.status{
    margin-top:18px;
    font-size:12px;
    color:#43e9a0;
    animation:statusBlink 2s infinite;
}

@keyframes statusBlink{
    50%{opacity:.5;}
}

/* AI ORB */

.ai-stage{
    height:300px;
    width:100%;
    max-width:400px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.orb{
    width:125px;
    height:125px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,
        #ffffff,
        #50eaff 15%,
        #0877db 45%,
        #071b50 80%);
    box-shadow:0 0 25px #00d9ff,
               0 0 60px #008cff,
               inset 0 0 25px #ffffff55;
    z-index:2;
    animation:jarvisPulse 3s ease-in-out infinite;
    transition:all .4s ease;
}

@keyframes jarvisPulse{
    0%,100%{
        transform:scale(1);
        filter:brightness(1);
        box-shadow:0 0 20px #00d9ff,0 0 50px #008cff;
    }
    50%{
        transform:scale(1.07);
        filter:brightness(1.3);
        box-shadow:0 0 35px #00eaff,0 0 80px #008cff;
    }
}

/* RINGS */

.ring{
    position:absolute;
    border:1px solid #36dfff;
    border-radius:50%;
    box-shadow:0 0 12px #00bfff66;
    transition:all .5s ease;
}

.ring1{
    width:175px;
    height:175px;
    border-top:2px solid #aafaff;
    animation:rotate 8s linear infinite;
}

.ring2{
    width:220px;
    height:220px;
    border-right:2px solid #55aaff;
    animation:rotate 12s linear infinite reverse;
}

.ring3{
    width:265px;
    height:265px;
    border-bottom:2px solid #48eaff;
    animation:rotate 18s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.ai-stage.active .orb{
    filter:brightness(1.5);
    transform:scale(1.1);
}

/* CHAT */

.chat-panel{
    width:100%;
    max-width:650px;
    background:#101d38;
    border:1px solid #24547c;
    border-radius:15px;
    padding:15px;
    box-shadow:0 0 20px #0008;
}

.panel-title{
    color:#42dfff;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:15px;
}

#chat{
    height:180px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

#chat::-webkit-scrollbar{
    width:4px;
}

#chat::-webkit-scrollbar-thumb{
    background:#36cfff;
    border-radius:10px;
}

.message{
    padding:10px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
    max-width:90%;
    word-break:break-word;
    animation:messageEnter .3s ease;
}

@keyframes messageEnter{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.jarvis-message{
    background:#15375a;
    align-self:flex-start;
}

.user-message{
    background:#174d87;
    align-self:flex-end;
}

/* INPUT */

.input-area{
    display:flex;
    gap:8px;
    margin-top:15px;
}

#userInput{
    flex:1;
    min-width:0;
    padding:13px;
    border-radius:9px;
    border:1px solid #287ca8;
    background:#07152c;
    color:white;
    outline:none;
    transition:.3s;
}

#userInput:focus{
    border-color:#43eaff;
    box-shadow:0 0 15px #00bfff55;
}

#sendBtn{
    padding:12px 18px;
    border:none;
    border-radius:9px;
    background:#087ebd;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#sendBtn:hover{
    background:#00a9e8;
    box-shadow:0 0 15px #00bfff;
}

/* MICROPHONE */

.controls{
    margin-top:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
}

#micBtn{
    width:58px;
    height:58px;
    border-radius:50%;
    border:1px solid #48dfff;
    background:#103b65;
    color:white;
    font-size:23px;
    cursor:pointer;
    box-shadow:0 0 20px #00bfff66;
    transition:.3s;
}

#micBtn:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #00dfff;
}

#micBtn.listening{
    background:#a51f40;
    border-color:#ff718f;
    animation:micPulse 1s infinite;
}

@keyframes micPulse{
    50%{box-shadow:0 0 30px #ff3355;}
}

/* FOOTER */

.footer{
    margin-top:25px;
    font-size:10px;
    letter-spacing:3px;
    color:#6689aa;
}

/* MOBILE */

@media(max-width:600px){
    .app{padding:12px;}
    .chat-panel{padding:12px;}
    #chat{height:165px;}
    .input-area{gap:6px;}
    #sendBtn{padding:11px 13px;}
    .controls{margin-top:18px;}
}

@media(max-width:400px){
    .logo{font-size:32px;}
    .ai-stage{height:270px;}
}

@media(max-width:350px){
    .logo{
        font-size:28px;
        letter-spacing:5px;
    }
    .orb{
        width:105px;
        height:105px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">JARVIS</div>
    <div class="subtitle">PERSONAL AI ASSISTANT</div>
    <div class="status" id="status">● SYSTEM ONLINE</div>
</header>

<div class="ai-stage" id="aiStage">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="orb"></div>
</div>

<div class="chat-panel">

    <div class="panel-title">JARVIS CONSOLE</div>

    <div id="chat">
        <div class="message jarvis-message">
            Hello Sir! I am JARVIS AI V1.0.
            How may I assist you today?
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask JARVIS anything..."
            autocomplete="off"
        >
        <button id="sendBtn">SEND</button>
    </div>

</div>

<div class="controls">
    <button id="micBtn">🎙</button>
</div>

<div class="footer">
    JARVIS INTELLIGENCE SYSTEM V1.0
</div>

</div>

<script>

/* JARVIS AI V1.0 ENGINE */

"use strict";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const statusText = document.getElementById("status");
const aiStage = document.getElementById("aiStage");

/* BACKEND URL */

const JARVIS_API_URL = "YOUR_BACKEND_URL";

/* VARIABLES */

let isListening = false;
let voiceEnabled = true;
let currentLanguage = "hi-IN";
let recognition = null;

/* CHAT MESSAGE */

function addMessage(message,type){

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = message;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* SPEAK */

function speak(text){

    if(!voiceEnabled) return;

    if(!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = currentLanguage;
    speech.rate = 1;
    speech.pitch = 1;

    speech.onstart = function(){
        statusText.textContent = "● JARVIS SPEAKING";
        aiStage.classList.add("active");
    };

    speech.onend = function(){
        statusText.textContent = "● SYSTEM ONLINE";
        aiStage.classList.remove("active");
    };

    speech.onerror = function(){
        statusText.textContent = "● SYSTEM ONLINE";
        aiStage.classList.remove("active");
    };

    window.speechSynthesis.speak(speech);
}

/* LANGUAGE */

function detectLanguage(text){

    if(/[\u0900-\u097F]/.test(text)){
        currentLanguage = "hi-IN";
    }else{
        currentLanguage = "en-IN";
    }
}

/* LOCAL COMMANDS */

function getResponse(text){

    const command = text.toLowerCase().trim();
    const hindi = currentLanguage === "hi-IN";

    if(
        command.includes("hello") ||
        command.includes("hi jarvis") ||
        command.includes("hey jarvis") ||
        command.includes("नमस्ते")
    ){
        return hindi
        ? "नमस्ते सर! मैं आपकी क्या मदद कर सकता हूँ?"
        : "Hello Sir! How may I help you?";
    }

    if(
        command.includes("help") ||
        command.includes("मदद")
    ){
        return hindi
        ? "सर, मैं Google और YouTube खोल सकता हूँ और AI से सवालों के जवाब दे सकता हूँ।"
        : "Sir, I can open Google and YouTube and answer questions using my AI connection.";
    }

    if(
        command.includes("open google") ||
        command.includes("google kholo") ||
        command.includes("गूगल खोलो")
    ){
        window.open("https://www.google.com","_blank");

        return hindi
        ? "जी सर, Google खोल रहा हूँ।"
        : "Opening Google, Sir.";
    }

    if(
        command.includes("open youtube") ||
        command.includes("youtube kholo") ||
        command.includes("यूट्यूब खोलो")
    ){
        window.open("https://www.youtube.com","_blank");

        return hindi
        ? "जी सर, YouTube खोल रहा हूँ।"
        : "Opening YouTube, Sir.";
    }

    if(command.startsWith("search ")){

        const query = text.substring(7).trim();

        window.open(
            "https://www.google.com/search?q=" +
            encodeURIComponent(query),
            "_blank"
        );

        return "Searching Google for " + query;
    }

    if(command.startsWith("play ")){

        const query = text.substring(5).trim();

        window.open(
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(query),
            "_blank"
        );

        return "Searching YouTube for " + query;
    }

    if(
        command.includes("thank you") ||
        command.includes("धन्यवाद")
    ){
        return hindi
        ? "आपका स्वागत है सर।"
        : "You are welcome, Sir.";
    }

    return null;
}

/* AI BRAIN CONNECTION */

async function askJarvisAI(message){

    if(
        !JARVIS_API_URL ||
        JARVIS_API_URL === "YOUR_BACKEND_URL"
    ){
        throw new Error("Backend URL is not configured.");
    }

    const response = await fetch(
        JARVIS_API_URL + "/api/chat",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:message
            })
        }
    );

    const data = await response.json();

    if(!response.ok){
        throw new Error(data.error || "AI server error");
    }

    if(!data.reply){
        throw new Error("No AI reply received.");
    }

    return data.reply;
}

/* PROCESS MESSAGE */

async function processMessage(text){

    text = text.trim();

    if(!text) return;

    detectLanguage(text);

    addMessage(text,"user-message");

    input.value = "";

    const localResponse = getResponse(text);

    if(localResponse){

        addMessage(localResponse,"jarvis-message");
        speak(localResponse);

        return;
    }

    statusText.textContent = "● THINKING";
    aiStage.classList.add("active");
    sendBtn.disabled = true;

    try{

        const answer = await askJarvisAI(text);

        addMessage(answer,"jarvis-message");
        speak(answer);

    }catch(error){

        console.error("JARVIS ERROR:",error);

        const errorMessage =
        currentLanguage === "hi-IN"
        ? "सर, मेरा AI Brain अभी कनेक्ट नहीं है। Backend URL और Server जाँचें।"
        : "Sir, my AI Brain is not connected. Please check the backend URL and server.";

        addMessage(errorMessage,"jarvis-message");
        speak(errorMessage);

    }finally{

        statusText.textContent = "● SYSTEM ONLINE";
        aiStage.classList.remove("active");
        sendBtn.disabled = false;
    }
}

/* SEND BUTTON */

sendBtn.addEventListener("click",function(){
    processMessage(input.value);
});

/* ENTER BUTTON */

input.addEventListener("keydown",function(event){

    if(event.key === "Enter"){
        processMessage(input.value);
    }
});

/* VOICE RECOGNITION */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(SpeechRecognition){

    recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function(){

        isListening = true;

        micBtn.classList.add("listening");
        statusText.textContent = "● LISTENING";
    };

    recognition.onresult = function(event){

        const transcript =
        event.results[0][0].transcript;

        processMessage(transcript);
    };

    recognition.onerror = function(event){

        statusText.textContent = "● VOICE ERROR";

        if(event.error === "not-allowed"){

            addMessage(
                "Microphone permission denied. Please allow microphone access.",
                "jarvis-message"
            );
        }
    };

    recognition.onend = function(){

        isListening = false;

        micBtn.classList.remove("listening");

        if(statusText.textContent === "● LISTENING"){
            statusText.textContent = "● SYSTEM ONLINE";
        }
    };

    micBtn.addEventListener("click",function(){

        if(isListening){
            recognition.stop();
            return;
        }

        try{
            recognition.lang = currentLanguage;
            recognition.start();
        }catch(error){
            statusText.textContent = "● PLEASE WAIT";
        }
    });

}else{

    micBtn.disabled = true;

    addMessage(
        "Voice recognition is not supported in this browser. Please use a supported browser.",
        "jarvis-message"
    );
}

/* ESCAPE SHORTCUT */

document.addEventListener("keydown",function(event){

    if(event.key === "Escape"){

        if(window.speechSynthesis){
            window.speechSynthesis.cancel();
        }

        if(isListening && recognition){
            recognition.stop();
        }
    }
});

console.log("JARVIS AI V1.0 ENGINE LOADED");

</script>

</body>
</html>
